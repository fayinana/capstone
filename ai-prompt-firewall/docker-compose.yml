services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firewall}
      POSTGRES_USER: ${POSTGRES_USER:-firewall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db}
    volumes:
      - firewall_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firewall} -d ${POSTGRES_DB:-firewall}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"

  proxy:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "${PROXY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      start_period: 2s
      retries: 15

  dashboard:
    build: .
    depends_on:
      proxy:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      FIREWALL_ADMIN_URL: http://proxy:8080
    command: >
      streamlit run src/dashboard/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"

volumes:
  firewall_pg:
